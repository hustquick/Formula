name: Build and publish macOS DMG

on:
  push:
    branches: [main]
    paths:
      - 'macos/**'
      - 'web/**'
      - 'scripts/**'
      - '.github/workflows/release-macos.yml'
      - 'package*.json'
      - 'build-vendor.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formula-macos-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Bundle offline editor and LaTeXLive catalog
        run: |
          npm ci
          node build-vendor.mjs
          node scripts/sync-latexlive-catalog.mjs
      - name: Compile universal app and verify DMG
        run: bash scripts/build-dmg.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Formula-macOS-DMG
          path: |
            dist/*.dmg
            dist/*.sha256
      - name: Publish versioned download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Info.plist)
          tag="v$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Formula $version" --notes '下载 DMG，打开后将 Formula.app 拖入 Applications。预编译通用应用支持 Apple Silicon 和 Intel；无需首次编译。LaTeX Live 快捷工具与公式模板目录已随应用离线打包。应用采用临时签名，尚未 Apple 公证。'
          fi
          gh release upload "$tag" "dist/Formula-$version.dmg" "dist/Formula-$version.dmg.sha256" --clobber
