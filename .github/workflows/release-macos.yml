name: Build and publish macOS DMG

on:
  push:
    branches: [main]
    paths:
      - 'Build-Mac.command'
      - 'macos/**'
      - 'web/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/release-macos.yml'
      - 'package*.json'
      - 'build-vendor.mjs'
  pull_request:
    branches: [main]
    paths:
      - 'Build-Mac.command'
      - 'macos/**'
      - 'web/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/release-macos.yml'
      - 'package*.json'
      - 'build-vendor.mjs'
  workflow_dispatch:
    inputs:
      real_ocr:
        description: Run real native installation and model inference (downloads weights)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: formula-macos-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Bundle offline editor and LaTeXLive catalog
        run: |
          npm ci
          npm run build:vendor
          npm run sync:latexlive
      - name: Validate Formula v1.1.0 release contract
        run: npm run validate:v1.1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate local OCR packaging
        run: |
          node tests/ocr-static.cjs
          node tests/ocr-process.cjs
          node tests/ocr-status.cjs
          node tests/ocr-install.cjs
          node tests/ocr-transaction.cjs
          python tests/ocr-runner.py
          node tests/ocr-image.cjs
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
          node tests/ocr-behavior.cjs
          node tests/document-behavior.cjs
          node tests/ocr-preview.cjs
          node tests/source-mode.cjs
          node tests/font-controls.cjs
          node tests/chemistry.cjs
          node tests/png-dpi.cjs
          node tests/shortcut-previews.cjs
          python -m venv "$RUNNER_TEMP/document-venv"
          "$RUNNER_TEMP/document-venv/bin/python" -m pip install -r macos/document-requirements.txt
          "$RUNNER_TEMP/document-venv/bin/python" macos/formula-document-runner.py --check
          "$RUNNER_TEMP/document-venv/bin/python" tests/document-runner.py
      - name: Validate actual Pix2Text dependency imports
        run: |
          python -m pip install -r macos/ocr-requirements.txt
          python -m pip check
          python macos/formula-ocr-runner.py --check
      - name: Validate isolated UniMERNet dependency imports
        run: |
          python -m venv "$RUNNER_TEMP/unimernet-venv"
          "$RUNNER_TEMP/unimernet-venv/bin/python" -m pip install -r macos/unimernet-requirements.txt
          "$RUNNER_TEMP/unimernet-venv/bin/python" -m pip check
          NO_ALBUMENTATIONS_UPDATE=1 "$RUNNER_TEMP/unimernet-venv/bin/python" macos/formula-ocr-runner.py --check --engine unimernet
      - name: Real native OCR installation and model inference
        if: github.event_name == 'workflow_dispatch' && inputs.real_ocr
        run: |
          python tests/ocr-integration.py --work-dir "$RUNNER_TEMP/formula-real-ocr"
          python tests/document-integration.py --ocr-root "$RUNNER_TEMP/formula-real-ocr/native-install-root/OCR" --work-dir "$RUNNER_TEMP/formula-document-real"
      - name: Compile universal app and verify DMG
        run: bash scripts/build-dmg.sh
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Formula-macOS-DMG
          path: |
            dist/*.dmg
            dist/*.sha256
      - name: Publish versioned download
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' macos/Info.plist)
          tag="v$version"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Formula $version" --notes-file docs/RELEASE_NOTES.md
          else
            gh release edit "$tag" --target "$GITHUB_SHA" --title "Formula $version" --notes-file docs/RELEASE_NOTES.md
          fi
          gh release upload "$tag" "dist/Formula-$version.dmg" "dist/Formula-$version.dmg.sha256" --clobber
