name: Build and publish Windows portable

on:
  push:
    branches: [main]
    paths:
      - 'windows/**'
      - 'web/**'
      - 'scripts/**'
      - 'Build-Windows.ps1'
      - '.github/workflows/release-windows.yml'
      - 'tests/windows-document-*.cjs'
      - 'package*.json'
      - 'build-vendor.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: formula-windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate document save and restart bridge
        shell: pwsh
        run: |
          node tests/windows-document-session.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/windows-document-bridge.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Windows portable app
        shell: pwsh
        run: ./Build-Windows.ps1
      - name: Smoke check packaged app
        shell: pwsh
        run: |
          $exe = 'dist/Formula-Windows-x64/Formula.exe'
          if (-not (Test-Path $exe)) { throw 'Formula.exe missing' }
          if (-not (Test-Path 'dist/Formula-Windows-x64/resources/app/web/index.html')) { throw 'web/index.html missing' }
          if (-not (Test-Path 'dist/Formula-Windows-x64/resources/app/web/vendor/latexlive/catalog.js')) { throw 'offline catalog missing' }
          if (-not (Test-Path 'dist/Formula-Windows-x64/resources/app/document-session.cjs')) { throw 'document session bridge missing' }
          if (-not (Test-Path 'dist/Formula-Windows-x64/resources/app/node_modules/sharp')) { throw 'sharp runtime missing' }
      - name: Validate packaged Formula save and restart
        shell: pwsh
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/windows-document-runtime.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Formula-Windows-x64
          path: |
            dist/Formula-*-Windows-x64.zip
            dist/Formula-*-Windows-x64.zip.sha256
      - name: Publish Windows download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content windows/package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          if (-not (gh release view $tag 2>$null)) {
            gh release create $tag --target $env:GITHUB_SHA --title "Formula $version" --notes-file docs/RELEASE_NOTES.md
          }
          gh release edit $tag --target $env:GITHUB_SHA
          gh release upload $tag "dist/Formula-$version-Windows-x64.zip" "dist/Formula-$version-Windows-x64.zip.sha256" --clobber
